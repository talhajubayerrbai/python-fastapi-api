---
- name: Configure FastAPI application server
  hosts: all
  become: true
  gather_facts: true

  handlers:
    - name: restart app
      ansible.builtin.systemd:
        name: app
        state: restarted
        daemon_reload: true

    - name: restart nginx
      ansible.builtin.systemd:
        name: nginx
        state: restarted

  tasks:
    - name: Wait for SSH to be available
      ansible.builtin.wait_for_connection:
        timeout: 120

    - name: Wait for cloud-init to finish
      ansible.builtin.command:
        cmd: cloud-init status --wait
      changed_when: false

    - name: Update apt cache and install runtime packages
      ansible.builtin.apt:
        name:
          - python3-venv
          - python3-pip
          - nginx
          - acl          # required for Ansible become + non-root user (setfacl)
        state: present
        update_cache: true
      retries: 5
      delay: 10

    - name: Create application directory
      ansible.builtin.file:
        path: /opt/app
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0755"

    - name: Copy application source
      ansible.builtin.copy:
        src: ../app/
        dest: /opt/app/app/
        owner: ubuntu
        group: ubuntu
        mode: "0644"

    - name: Copy requirements
      ansible.builtin.copy:
        src: ../requirements.txt
        dest: /opt/app/requirements.txt
        owner: ubuntu
        group: ubuntu
        mode: "0644"

    - name: Create virtualenv
      ansible.builtin.command:
        cmd: python3 -m venv /opt/app/venv
        creates: /opt/app/venv/bin/python

    - name: Install Python dependencies into the venv
      ansible.builtin.pip:
        requirements: /opt/app/requirements.txt
        virtualenv: /opt/app/venv
        virtualenv_python: python3

    - name: Install systemd unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/app.service
        mode: "0644"
        content: |
          [Unit]
          Description=FastAPI application
          After=network.target

          [Service]
          User=ubuntu
          WorkingDirectory=/opt/app
          ExecStart=/opt/app/venv/bin/uvicorn app.main:app --host 127.0.0.1 --port 8000
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
      notify: restart app

    - name: Install nginx site
      ansible.builtin.copy:
        dest: /etc/nginx/sites-available/default
        mode: "0644"
        content: |
          server {
            listen 80 default_server;
            server_name _;

            location / {
              proxy_pass         http://127.0.0.1:8000;
              proxy_http_version 1.1;
              proxy_set_header   Host              $host;
              proxy_set_header   X-Real-IP         $remote_addr;
              proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
              proxy_set_header   X-Forwarded-Proto $scheme;
              proxy_read_timeout 60s;
            }
          }
      notify: restart nginx

    - name: Flush handlers so app and nginx restart before the health wait
      ansible.builtin.meta: flush_handlers

    - name: Enable and start app service
      ansible.builtin.systemd:
        name: app
        state: started
        enabled: true
        daemon_reload: true

    - name: Enable and start nginx
      ansible.builtin.systemd:
        name: nginx
        state: started
        enabled: true

    - name: Wait for FastAPI to be listening on port 8000
      ansible.builtin.wait_for:
        port: 8000
        host: 127.0.0.1
        timeout: 60
